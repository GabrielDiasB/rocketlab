resources:
  jobs:
    CineData_Pipeline_Medallion:
      name: CineData_Pipeline_Medallion
      schedule:
        quartz_cron_expression: 41 0 8 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: to_bronze
          notebook_task:
            notebook_path: /Workspace/Users/g257756@dac.unicamp.br/Landing_to_Bronze
            base_parameters:
              catalog: cinedata_analytics
            source: WORKSPACE
        - task_key: to_silver
          depends_on:
            - task_key: to_bronze
          notebook_task:
            notebook_path: /Workspace/Users/g257756@dac.unicamp.br/Bronze_to_Silver
            base_parameters:
              catalog: cinedata_analytics
            source: WORKSPACE
        - task_key: to_gold
          depends_on:
            - task_key: to_silver
          notebook_task:
            notebook_path: /Workspace/Users/g257756@dac.unicamp.br/Silver_to_Gold
            base_parameters:
              catalog: cinedata_analytics
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
